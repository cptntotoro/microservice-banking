spring:
  application:
    name: discovery-server

server:
  port: 8761

management:
  tracing:
    enabled: true
    sampling:
      probability: 1
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.consul: DEBUG
    ru.practicum: DEBUG