apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "serv-auth-service.fullname" . }}
  labels:
    {{- include "serv-auth-service.labels" . | nindent 4 }}
data:
  application.yml: |-
    server:
      port: {{ .Values.service.port }}
    spring:
      application:
        name: serv-auth-service
      main:
        allow-bean-definition-overriding: true
        web-application-type: reactive
      r2dbc:
        url: r2dbc:postgresql://{{ .Values.env.DB_HOST }}:{{ .Values.env.DB_PORT }}/serv_auth_service
        username: {{ .Values.env.DB_USERNAME }}
        password: ${DB_PASSWORD}
        pool:
          enabled: true
          initial-size: 10
          max-size: 50
          max-idle-time: 30m
          max-life-time: 60m
          validation-query: SELECT 1
      security:
        oauth2:
          authorizationserver:
            client:
              front-ui-service:
                registration:
                  client-id: front-ui-service
                  client-secret: ${CLIENT_SECRET}
                  client-authentication-methods: client_secret_basic
                  authorization-grant-types: client_credentials
                  scopes: front-ui-service.read,front-ui-service.write
              account-service:
                registration:
                  client-id: account-service
                  client-secret: ${CLIENT_SECRET}
                  client-authentication-methods: client_secret_basic
                  authorization-grant-types: client_credentials
                  scopes: account-service.read,account-service.write
              user-auth-service:
                registration:
                  client-id: user-auth-service
                  client-secret: ${CLIENT_SECRET}
                  client-authentication-methods: client_secret_basic
                  authorization-grant-types: client_credentials
                  scopes: user-auth-service.read,user-auth-service.write
              blocker-service:
                registration:
                  client-id: blocker-service
                  client-secret: ${CLIENT_SECRET}
                  client-authentication-methods: client_secret_basic
                  authorization-grant-types: client_credentials
                  scopes: blocker-service.read,blocker-service.write
              cash-service:
                registration:
                  client-id: cash-service
                  client-secret: ${CLIENT_SECRET}
                  client-authentication-methods: client_secret_basic
                  authorization-grant-types: client_credentials
                  scopes: cash-service.read,cash-service.write
              exchange-generator-service:
                registration:
                  client-id: exchange-generator-service
                  client-secret: ${CLIENT_SECRET}
                  client-authentication-methods: client_secret_basic
                  authorization-grant-types: client_credentials
                  scopes: exchange-generator-service.read,exchange-generator-service.write
              exchange-service:
                registration:
                  client-id: exchange-service
                  client-secret: ${CLIENT_SECRET}
                  client-authentication-methods: client_secret_basic
                  authorization-grant-types: client_credentials
                  scopes: exchange-service.read,exchange-service.write
              transfer-service:
                registration:
                  client-id: transfer-service
                  client-secret: ${CLIENT_SECRET}
                  client-authentication-methods: client_secret_basic
                  authorization-grant-types: client_credentials
                  scopes: transfer-service.read,transfer-service.write
              notification-service:
                registration:
                  client-id: notification-service
                  client-secret: ${CLIENT_SECRET}
                  client-authentication-methods: client_secret_basic
                  authorization-grant-types: client_credentials
                  scopes: notification-service.read,notification-service.write
          resourceserver:
            jwt:
              issuer-uri: {{ .Values.env.GATEWAY_URL }}-{{ .Release.Namespace }}{{ .Values.env.AUTH_SERVICE_JWT_ISSUER_URI }}
              jwk-set-uri: {{ .Values.env.GATEWAY_URL }}-{{ .Release.Namespace }}{{ .Values.env.AUTH_SERVICE_JWT_JWK_SET_URI }}
    management:
      tracing:
        enabled: true
        sampling:
          probability: 1.0
      endpoints:
        web:
          exposure:
            include: '*'
      endpoint:
        health:
          show-details: always
    logging:
      level:
        org.springframework: ERROR
        ru.practicum: WARN
        org.springframework.web: WARN
        org.springframework.cloud: WARN
        org.springframework.cloud.gateway: DEBUG
        reactor.netty: ERROR
        org.springframework.security: DEBUG
      pattern:
        console: "%d{dd-MM-yyyy HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  log4j2.xml: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <Configuration status="WARN">
        <Appenders>
            <Console name="Console" target="SYSTEM_OUT">
                <PatternLayout pattern="%d{HH:mm:ss.SSS} %-5level: %msg%n"/>
            </Console>

            <Kafka name="Kafka" topic="{{ .Values.env.KAFKA_LOGS_TOPIC }}-logs">
                <PatternLayout pattern="%d{HH:mm:ss.SSS} %-5level: %msg%n"/>
                <Property name="bootstrap.servers" value={{ include "serv-auth-service.kafka.servers" . | quote }}/>
                <Property name="key.serializer" value="org.apache.kafka.common.serialization.StringSerializer"/>
                <Property name="value.serializer" value="org.apache.kafka.common.serialization.StringSerializer"/>
            </Kafka>
        </Appenders>

        <Loggers>
            <Logger name="ru.yandex.practicum.accounts" level="info" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Logger>

            <Logger name="org.springframework" level="warn" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Logger>

            <Logger name="org.apache.kafka" level="warn" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Logger>

            <Root level="info">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Root>
        </Loggers>
    </Configuration>