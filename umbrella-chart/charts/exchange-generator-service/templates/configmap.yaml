apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "exchange-generator-service.fullname" . }}
  labels:
    {{- include "exchange-generator-service.labels" . | nindent 4 }}
data:
  application.yml: |-
    server:
      port: {{ .Values.service.port }}
    exchange:
      rate:
        generation:
          interval:
            ms: {{ .Values.env.EXCHANGE_RATE_GENERATION_INTERVAL_MS }}
    app:
      currencies:
        supported: {{ .Values.env.APP_CURRENCIES_SUPPORTED | splitList "," | toYaml | nindent 8 }}
    spring:
      application:
        name: exchange-generator-service
      cloud:
        consul:
          config:
            enabled: false
          discovery:
            instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
            service-name: ${spring.application.name}
            prefer-ip-address: true
            health-check-path: /actuator/health
            health-check-interval: 15s
            register: true
            enabled: true
      r2dbc:
        url: r2dbc:postgresql://{{ .Release.Name }}-{{ .Values.env.DB_HOST }}:{{ .Values.env.DB_PORT }}/exchange_generator_service
        username: {{ .Values.env.DB_USERNAME }}
        password: ${DB_PASSWORD}
        pool:
          enabled: true
          initial-size: 10
          max-size: 50
          max-idle-time: 30m
          max-life-time: 60m
          validation-query: SELECT 1
      scheduling:
        enabled: true
        task:
          scheduling:
            enabled: true
      main:
        web-application-type: reactive
      kafka:
        bootstrap-servers: {{ include "exchange-generator-service.kafka.servers" . }}
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: {{ .Values.env.GATEWAY_URL }}-{{ .Release.Namespace }}{{ .Values.env.AUTH_SERVICE_JWT_ISSUER_URI }}
              jwk-set-uri: {{ .Values.env.GATEWAY_URL }}-{{ .Release.Namespace }}{{ .Values.env.AUTH_SERVICE_JWT_JWK_SET_URI }}
          client:
            registration:
              exchange-service:
                provider: exchange-service
                client-id: exchange-generator-service
                client-secret: ${EXCHANGE_GENERATOR_CLIENT_SECRET}
                client-authentication-method: client_secret_basic
                authorization-grant-type: client_credentials
                scope: exchange-service.read,exchange-service.write
            provider:
              exchange-service:
                token-uri: {{ .Values.env.GATEWAY_URL }}-{{ .Release.Namespace }}{{ .Values.env.AUTH_SERVICE_TOKEN_URL }}
    management:
      tracing:
        enabled: true
        sampling:
          probability: 1.0
      endpoints:
        web:
          exposure:
            include: '*'
      endpoint:
        health:
          show-details: always
    logging:
      level:
        org.springframework: INFO
        ru.practicum: DEBUG
      pattern:
        console: "%d{dd-MM-yyyy HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  log4j2.xml: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <Configuration status="WARN">
        <Appenders>
            <Console name="Console" target="SYSTEM_OUT">
                <PatternLayout pattern="%d{HH:mm:ss.SSS} %-5level: %msg%n"/>
            </Console>

            <Kafka name="Kafka" topic="{{ .Values.env.KAFKA_LOGS_TOPIC }}-logs">
                <PatternLayout pattern="%d{HH:mm:ss.SSS} %-5level: %msg%n"/>
                <Property name="bootstrap.servers" value={{ include "exchange-generator-service.kafka.servers" . | quote }}/>
                <Property name="key.serializer" value="org.apache.kafka.common.serialization.StringSerializer"/>
                <Property name="value.serializer" value="org.apache.kafka.common.serialization.StringSerializer"/>
            </Kafka>
        </Appenders>

        <Loggers>
            <Logger name="ru.yandex.practicum.accounts" level="info" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Logger>

            <Logger name="org.springframework" level="warn" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Logger>

            <Logger name="org.apache.kafka" level="warn" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Logger>

            <Root level="info">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Root>
        </Loggers>
    </Configuration>