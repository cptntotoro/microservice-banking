apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "transfer-service.fullname" . }}
  labels:
    {{- include "transfer-service.labels" . | nindent 4 }}
data:
  application.yml: |-
    server:
      port: {{ .Values.service.port }}
    spring:
      application:
        name: transfer-service
      profiles:
        active: {{ .Values.env.SPRING_PROFILES_ACTIVE }}
      r2dbc:
        url: r2dbc:postgresql://{{ .Values.env.DB_HOST }}:{{ .Values.env.DB_PORT }}/transfer_service
        username: {{ .Values.env.DB_USERNAME }}
        password: ${DB_PASSWORD}
        pool:
          enabled: true
          initial-size: 10
          max-size: 50
          max-idle-time: 30m
          max-life-time: 60m
          validation-query: SELECT 1
      main:
        web-application-type: reactive
      kafka:
        bootstrap-servers: {{ include "transfer-service.kafka.servers" . }}
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: {{ .Values.env.GATEWAY_URL }}-{{ .Release.Namespace }}{{ .Values.env.AUTH_SERVICE_JWT_ISSUER_URI }}
              jwk-set-uri: {{ .Values.env.GATEWAY_URL }}-{{ .Release.Namespace }}{{ .Values.env.AUTH_SERVICE_JWT_JWK_SET_URI }}
          client:
            registration:
              account-service:
                provider: account-service
                client-id: transfer-service
                client-secret: ${TRANSFER_CLIENT_SECRET}
                client-authentication-method: client_secret_basic
                authorization-grant-type: client_credentials
                scope: account-service.read,account-service.write
              cash-service:
                provider: cash-service
                client-id: transfer-service
                client-secret: ${TRANSFER_CLIENT_SECRET}
                client-authentication-method: client_secret_basic
                authorization-grant-type: client_credentials
                scope: cash-service.read,cash-service.write
              blocker-service:
                provider: blocker-service
                client-id: transfer-service
                client-secret: ${TRANSFER_CLIENT_SECRET}
                client-authentication-method: client_secret_basic
                authorization-grant-type: client_credentials
                scope: blocker-service.read,blocker-service.write
              notification-service:
                provider: notification-service
                client-id: transfer-service
                client-secret: ${TRANSFER_CLIENT_SECRET}
                client-authentication-method: client_secret_basic
                authorization-grant-type: client_credentials
                scope: notification-service.read,notification-service.write
            provider:
              account-service:
                token-uri: {{ .Values.env.GATEWAY_URL }}-{{ .Release.Namespace }}{{ .Values.env.AUTH_SERVICE_TOKEN_URL }}
              cash-service:
                token-uri: {{ .Values.env.GATEWAY_URL }}-{{ .Release.Namespace }}{{ .Values.env.AUTH_SERVICE_TOKEN_URL }}
              blocker-service:
                token-uri: {{ .Values.env.GATEWAY_URL }}-{{ .Release.Namespace }}{{ .Values.env.AUTH_SERVICE_TOKEN_URL }}
              notification-service:
                token-uri: {{ .Values.env.GATEWAY_URL }}-{{ .Release.Namespace }}{{ .Values.env.AUTH_SERVICE_TOKEN_URL }}
    management:
      tracing:
        enabled: true
        sampling:
          probability: 1.0
      endpoints:
        web:
          exposure:
            include: '*'
      endpoint:
        health:
          show-details: always
    logging:
      level:
        org.springframework: INFO
        ru.practicum: DEBUG
        org.springframework.web: DEBUG
        reactor.netty: DEBUG
      pattern:
        console: "%d{dd-MM-yyyy HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  log4j2.xml: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <Configuration status="WARN">
        <Appenders>
            <Console name="Console" target="SYSTEM_OUT">
                <PatternLayout pattern="%d{HH:mm:ss.SSS} %-5level: %msg%n"/>
            </Console>

            <Kafka name="Kafka" topic="{{ .Values.env.KAFKA_LOGS_TOPIC }}-logs">
                <PatternLayout pattern="%d{HH:mm:ss.SSS} %-5level: %msg%n"/>
                <Property name="bootstrap.servers" value={{ include "transfer-service.kafka.servers" . | quote }}/>
                <Property name="key.serializer" value="org.apache.kafka.common.serialization.StringSerializer"/>
                <Property name="value.serializer" value="org.apache.kafka.common.serialization.StringSerializer"/>
            </Kafka>
        </Appenders>

        <Loggers>
            <Logger name="ru.yandex.practicum.accounts" level="info" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Logger>

            <Logger name="org.springframework" level="warn" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Logger>

            <Logger name="org.apache.kafka" level="warn" additivity="false">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Logger>

            <Root level="info">
                <AppenderRef ref="Console"/>
                <AppenderRef ref="Kafka"/>
            </Root>
        </Loggers>
    </Configuration>