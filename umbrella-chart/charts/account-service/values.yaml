replicaCount: 1

image:
  repository: account-service
  pullPolicy: Never
  tag: "latest"

service:
  type: ClusterIP
  port: 8082

ingress:
  enabled: false

env:
  SPRING_PROFILES_ACTIVE: prod
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: postgres
  AUTH_SERVICE_JWT_ISSUER_URI:  /serv-auth-service
  AUTH_SERVICE_JWT_JWK_SET_URI:  /serv-auth-service/oauth2/jwks
  APP_CURRENCIES_SUPPORTED: "RUB,USD,EUR,CNY,GBP,JPY"
  GATEWAY_URL: http://api-gateway-server
  ZIPKIN_URL: http://zipkin
  ZIPKIN_URL_PORT: 9411
  ZIPKIN_URI_SPANS: /api/v2/spans
  ZIPKIN_SAMPLING_PROBABILITY: 1
  KAFKA_HOSTS: >-
    microbank-kafka-controller-0.microbank-kafka-controller-headless,
    microbank-kafka-controller-1.microbank-kafka-controller-headless,
    microbank-kafka-controller-2.microbank-kafka-controller-headless
  KAFKA_LOGS_TOPIC: account-service

secret:
  DB_PASSWORD: postgres

resources: {}

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

fullnameOverride: account-service